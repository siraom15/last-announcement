<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<title>เสียงตามสาย — The Last Announcement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&family=Noto+Serif+Thai:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
  <canvas id="game" width="960" height="540"></canvas>
  <div id="ui">
    <div id="objective"></div>
    <div id="toast"></div>
    <div id="cue"></div>
    <div id="hint"></div>
    <div id="slats"></div>
    <div id="listenInd">● กำลังฟัง…</div>
    <div id="announce"></div>
    <div id="lbTop" class="lb"></div><div id="lbBot" class="lb"></div>
    <img id="portL" class="port" alt=""><img id="portR" class="port" alt="">
    <div id="subs"><span class="who"></span><span class="txt"></span></div>
    <div id="prompt"></div>
    <div id="modal"></div>
    <div id="title"></div>
    <div id="credits"></div>
    <div id="card"></div>
    <div id="menu"></div>
  </div>
</div>

<div id="controls">
  <div id="dpad"><button data-btn="left" aria-label="ซ้าย">◀</button><button data-btn="right" aria-label="ขวา">▶</button></div>
  <div id="acts">
    <button data-btn="use" id="useBtn" class="big">ใช้</button>
    <button data-btn="run" class="b-run">วิ่ง</button>
    <button data-btn="flash" class="b-flash">ไฟฉาย</button>
    <button data-btn="crouch" id="crouchBtn" class="b-crouch">ย่อ</button>
    <button data-btn="listen" class="b-listen">ฟัง</button>
  </div>
  <div id="topbtns"><button data-btn="journal">สมุด</button><button data-btn="pause" aria-label="หยุด">❚❚</button></div>
</div>

<div id="rotate"><div><b>⟳</b><p>กรุณาหมุนโทรศัพท์เป็นแนวนอน</p></div></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
